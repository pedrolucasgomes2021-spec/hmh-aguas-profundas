<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06121e">
<meta name="robots" content="noindex">
<title>HMH — Câmera virtual</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<style>
:root{--bg:#06121e;--card:#0f2234;--line:rgba(255,255,255,.12);--ink:#eaf6ff;--soft:rgba(234,246,255,.7);--azul:#59d0ff;--rec:#ff4d4d;--ok:#5fdca8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:500 15px/1.3 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:12px;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;gap:10px}
header a{display:grid;place-content:center;width:36px;height:36px;border-radius:50%;background:var(--card);color:var(--ink);text-decoration:none;font-size:20px}
header h1{flex:1;font:600 17px/1.1 Oswald,Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft)}.st i{width:9px;height:9px;border-radius:50%;background:#f5b041}.st.on i{background:var(--ok)}.st.off i{background:var(--rec)}
.info{padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);min-height:58px}
.info small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--azul)}.info b{display:block;margin-top:3px;font-size:16px}
.info.rec small{color:var(--rec)}
.row{display:flex;gap:8px}.row>button{flex:1;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.row>button[aria-pressed=true]{background:var(--ink);color:#0e2a4a}
.lens button{height:36px;font-size:13px}
#rec{color:var(--rec)}#rec[aria-pressed=true]{background:var(--rec);color:#fff}
.pads{margin-top:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}
.pad{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--soft)}
.joy{position:relative;width:min(38vw,150px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#13304a,#0b1d2d);border:1px solid var(--line);touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;margin:-21% 0 0 -21%;border-radius:50%;background:#f4f8fb;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:transform .12s}
.joy.act .knob{transition:none}
.vs{position:relative;width:54px;height:min(38vw,150px);border-radius:27px;background:linear-gradient(#13304a,#0b1d2d);border:1px solid var(--line);touch-action:none}.vs .knob{width:40px;margin:-20px 0 0 -20px}
.msg{margin:auto 0;padding:18px;border-radius:16px;background:var(--card);line-height:1.5;color:var(--soft);display:none}
body.nohash .msg{display:block}body.nohash .ctl{display:none}
.ctl{display:contents}
small.nt{font-size:11px;color:var(--soft);text-align:center}
</style>
</head>
<body>
<header><a href="./" aria-label="Voltar ao site" id="back">‹</a><h1 id="ttl">Câmera virtual</h1><span class="st" id="st"><i></i><span id="stT">Conectando…</span></span></header>
<p class="msg" id="msg"></p>
<div class="ctl">
 <div class="info" id="info"><small id="iK"></small><b id="iT">—</b></div>
 <div class="row lens" id="lens" role="group"></div>
 <div class="row"><button id="gyro" aria-pressed="false"></button><button id="recenter"></button><button id="rec" aria-pressed="false"></button></div>
 <div class="row"><button id="prev" aria-label="Plano anterior">◀</button><button id="auto"></button><button id="next" aria-label="Próximo plano">▶</button></div>
 <div class="pads">
  <div class="pad"><div class="joy" id="jm"><i class="knob"></i></div><span id="lm"></span></div>
  <div class="pad"><div class="vs" id="ju"><i class="knob"></i></div><span id="lu"></span></div>
  <div class="pad"><div class="joy" id="jl"><i class="knob"></i></div><span id="ll"></span></div>
 </div>
 <small class="nt" id="nt"></small>
</div>
<script src="assets/vendor/peerjs/peerjs.min.js"></script>
<script src="assets/js/controle.js"></script>
</body>
</html>
