<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#04101F">
<title>HMH — Águas Profundas</title>
<style>
:root{
  --abismo:#04101F; --navy:#0e2a4a; --ink:#EAF6FF; --soft:rgba(226,240,250,.86);
  --azul:#1496C8; --verm:#D9303C; --ambar:#FFB347; --ease:cubic-bezier(.2,.8,.2,1);
  --rail:26px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{background:var(--abismo);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--ambar);outline-offset:2px}

/* ---------- barra superior ---------- */
.top{position:fixed;inset:0 0 auto 0;height:48px;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px 0 calc(var(--rail) + 12px);
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.78));backdrop-filter:blur(6px);color:#0e2a4a;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.top .menu{width:34px;height:34px;display:grid;place-content:center;gap:5px}
.top .menu i{display:block;width:18px;height:2px;background:#0e2a4a;border-radius:2px}
.top .logo{height:24px;width:60px}
.top .pill{justify-self:end;background:var(--navy);color:#fff;font-weight:600;font-size:12px;letter-spacing:.04em;padding:8px 16px;border-radius:5px;text-decoration:none;transition:background .3s}
.top .pill:hover{background:var(--verm)}
.drawer{position:fixed;top:48px;left:var(--rail);width:min(300px,calc(100vw - var(--rail)));z-index:49;background:rgba(4,16,31,.94);backdrop-filter:blur(8px);border-radius:0 0 8px 0;padding:10px 0;transform:translateX(-110%);transition:transform .45s var(--ease)}
.drawer.on{transform:none}
.drawer button{display:flex;gap:12px;width:100%;text-align:left;padding:11px 18px;font-size:13px;font-weight:500;border-left:3px solid transparent}
.drawer button b{color:var(--ambar);font-variant-numeric:tabular-nums}
.drawer button:hover,.drawer button.cur{background:rgba(255,255,255,.07);border-left-color:var(--verm)}

/* ---------- trilho de seções ---------- */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:48;display:flex;flex-direction:column}
.rail .seg{flex:1;position:relative;transition:filter .4s}
.rail .seg:not(.on){filter:brightness(.7) saturate(.8)}
.rail .seg button{position:absolute;left:50%;top:14px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:2px solid #fff;background:#0e2a4a;transition:background .3s,transform .3s var(--ease)}
.rail .seg.on button{background:#fff;transform:scale(1.25)}
.rail .seg.done::after,.rail .seg.on::after{content:"";position:absolute;left:50%;top:32px;bottom:-2px;width:2px;margin-left:-1px;background:rgba(255,255,255,.7)}
.rail .seg.on::after{background:linear-gradient(#fff,rgba(255,255,255,.1))}

/* ---------- HUD ---------- */
.hud{position:fixed;right:12px;top:60px;z-index:45;width:150px;padding:10px 12px;border-radius:8px;background:rgba(4,16,31,.62);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);font-size:11px;color:var(--soft)}
.hud div{display:flex;justify-content:space-between;padding:2px 0}
.hud b{font-family:Oswald,"Arial Narrow",sans-serif;font-weight:500;font-size:15px;color:#fff;font-variant-numeric:tabular-nums}
.hud .big b{font-size:22px;color:var(--ambar)}
.hud small{display:block;margin-top:6px;opacity:.7;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.nav2{position:fixed;right:14px;bottom:96px;z-index:45;display:grid;gap:10px}
.nav2 button{width:30px;height:30px;border-radius:50%;display:grid;place-content:center;font-size:14px;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .3s var(--ease)}
.nav2 button:hover{transform:scale(1.12)}
.nav2 .up{background:var(--verm)} .nav2 .dn{background:#7a7e83}
.bottom{position:fixed;inset:auto 0 0 0;height:36px;z-index:47;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 calc(var(--rail) + 12px);background:linear-gradient(90deg,#0b2542,#12355c);font-size:12px;font-weight:600;letter-spacing:.06em}
.bottom .logo{height:20px;width:50px;position:absolute;left:50%;transform:translateX(-50%)}
.bottom .arr{display:flex;gap:6px}
.bottom .arr button{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.2);font-size:12px}

/* ---------- mundo ---------- */
#world{position:relative;width:max(100vw,820px);margin-left:calc(50vw - max(100vw,820px)/2);line-height:0}
#art{display:block;width:100%;height:auto}
.panels{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:20}
.panel{position:absolute;left:calc(var(--rail) + 30px);width:min(340px,calc(100vw - var(--rail) - 44px));padding:16px 18px 18px;background:rgba(4,18,36,.5);backdrop-filter:blur(5px);border-radius:4px;border-left:3px solid var(--verm);line-height:1.5;will-change:opacity,transform;pointer-events:auto}
.panel h2{font-family:Oswald,"Arial Narrow",Impact,sans-serif;font-weight:600;font-size:clamp(18px,1.7vw,24px);letter-spacing:.02em;text-transform:uppercase;line-height:1.15;margin-bottom:8px}
.panel h2 em{font-style:normal;color:var(--ambar);margin-right:6px}
.panel p{font-size:13px;color:var(--soft)}
.panel a.btn{display:inline-block;margin-top:12px;background:var(--verm);color:#fff;font-weight:600;font-size:12px;padding:7px 16px;border-radius:3px;text-decoration:none;transition:background .3s,transform .3s var(--ease)}
.panel a.btn:hover{background:var(--ambar);color:#1a0b05;transform:translateY(-2px)}

#hots{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.hot{pointer-events:auto;position:absolute;z-index:25;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid #fff;background:rgba(20,150,200,.35);box-shadow:0 0 0 0 rgba(20,150,200,.7);animation:ping 2.4s infinite;transition:opacity .4s}
.hot.ctx{border-color:rgba(255,255,255,.7);background:rgba(150,160,170,.3);animation-name:pingg;box-shadow:0 0 0 0 rgba(180,190,200,.5)}
.hot::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#fff}
.hot[data-off="1"]{opacity:0;pointer-events:none}
@keyframes ping{70%{box-shadow:0 0 0 14px rgba(20,150,200,0)}100%{box-shadow:0 0 0 0 rgba(20,150,200,0)}}
@keyframes pingg{70%{box-shadow:0 0 0 12px rgba(180,190,200,0)}100%{box-shadow:0 0 0 0 rgba(180,190,200,0)}}
.card{position:fixed;z-index:70;width:260px;padding:14px 16px;border-radius:8px;background:rgba(4,16,31,.94);border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 30px rgba(0,0,0,.5);line-height:1.5;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .3s,transform .4s var(--ease)}
.card.on{opacity:1;pointer-events:auto;transform:none}
.card h3{font-size:14px;margin-bottom:4px}
.card .tag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;margin-bottom:8px;background:var(--azul)}
.card .tag.ctx{background:#6c7076}
.card p{font-size:12.5px;color:var(--soft)}
.card a{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;color:var(--ambar);text-decoration:none}
.card .x{position:absolute;right:8px;top:6px;font-size:16px;opacity:.7}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}

/* ---------- animações do SVG ---------- */
.wv{animation:wv var(--d,9s) linear infinite}
@keyframes wv{to{transform:translateX(var(--shift))}}
#ship{transform-origin:600px 540px;animation:bob 7s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-4px) rotate(-.45deg)}to{transform:translateY(7px) rotate(.5deg)}}
#riser{transform-origin:600px 3560px;animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{from{transform:skewX(-.45deg)}to{transform:skewX(.45deg)}}
.drift{animation:drift 11s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-40px,-10px)}to{transform:translate(50px,12px)}}
.flick{animation:flick 3.4s steps(1,end) infinite}
@keyframes flick{0%{opacity:.9}20%{opacity:.6}35%{opacity:1}55%{opacity:.75}75%{opacity:.95}100%{opacity:.85}}
.cloud{animation:cloud 90s linear infinite}
@keyframes cloud{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
.gull{animation:cloud 38s linear infinite}
.ray{animation:ray 8s ease-in-out infinite alternate}
@keyframes ray{from{opacity:.05}to{opacity:.17}}
.swim{animation:swim var(--d,40s) linear infinite}
@keyframes swim{from{transform:translateX(-120px)}to{transform:translateX(1350px)}}
.bub{animation:bub var(--d,5s) ease-in infinite;opacity:0}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-130px);opacity:0}}
.jelly{animation:jelly 3.6s ease-in-out infinite;transform-origin:center}
@keyframes jelly{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-26px) scale(1.08,.9)}}
.rn{animation:rn 5s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes rn{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
.crane{animation:crane 9s ease-in-out infinite alternate}
@keyframes crane{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.swing{animation:swing 4s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.tens{animation:tens 7s ease-in-out infinite alternate}
@keyframes tens{from{transform:translateY(-3px)}to{transform:translateY(6px)}}
.march{stroke-dasharray:6 10;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
.marchup{stroke-dasharray:3 14;animation:marchup 1.6s linear infinite}
@keyframes marchup{to{stroke-dashoffset:17}}
.spin{stroke-dasharray:7 7;animation:march .5s linear infinite}
.shake{animation:shake .25s linear infinite alternate}
@keyframes shake{from{transform:translate(-.8px,.5px)}to{transform:translate(.8px,-.5px)}}
.chip{animation:chip 2.2s ease-out infinite;opacity:0}
@keyframes chip{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx,20px),-70px) rotate(220deg);opacity:0}}
.led{animation:led 1.6s steps(1,end) infinite}
@keyframes led{0%{opacity:1}50%{opacity:.15}}
.oilbob{animation:oilbob 6s ease-in-out infinite alternate}
@keyframes oilbob{from{transform:translateY(0)}to{transform:translateY(5px)}}
.gasb{animation:gasb 5s ease-in infinite;opacity:0}
@keyframes gasb{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-60px);opacity:0}}
.rv{transition:opacity .2s linear}

@media (max-width:767px){
  .top .menu+div{display:none}
  .hud{top:56px;right:8px;width:128px;font-size:10px}
  .nav2{bottom:90px;right:8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  #snow{display:none}
}
</style>
</head>

}}

// bolhas
{const b=$('#bubbles');const spots=[[600,3800,60],[840,2870,30],[330,3020,30],[300,3750,30],[900,3750,30]];
 spots.forEach(([x,y,w])=>{for(let i=0;i<6;i++)el('circle',{cx:x+(rnd()-.5)*w*2,cy:y,r:1.5+rnd()*3,fill:'none',stroke:'#cdefff','stroke-width':1.2,class:'bub',style:`--d:${3.5+rnd()*3}s;animation-delay:${-rnd()*6}s`},b)})}
// gás
{const g=$('#gas');[[740,5330],[790,5310],[850,5340],[900,5320],[950,5330],[820,5290],[880,5300]].forEach(([x,y],i)=>{const c=el('circle',{cx:x,cy:y,r:5+rnd()*6},g);el('circle',{cx:x,cy:y-10,r:2.5,fill:'#fff',class:'gasb',style:`animation-delay:${-i*.7}s`},g)})}
// estilhaços da broca
{const c=$('#chips');for(let i=0;i<9;i++)el('polygon',{points:'0,0 5,2 3,6 -2,4',class:'chip',transform:`translate(${-40+i*10} ${60+(i%3)*8})`,style:`--dx:${(i%2?1:-1)*(10+i*3)}px;animation-delay:${-i*.25}s`},c)}

/* ---------- painéis, trilho, menu ---------- */
const world=$('#world'),panels=$('#panels'),rail=$('#rail'),drawer=$('#drawer');
SECS.forEach((s,i)=>{
  const n=String(i+1).padStart(2,'0');
  const p=document.createElement('section');p.className='panel';p.dataset.i=i;
  p.innerHTML=`<h2><em>${n}.</em>${s.t}</h2><p>${s.p}</p><a class="btn" href="${BASE+s.u}" target="_blank" rel="noopener">Saiba mais</a>`;
  panels.appendChild(p);s.el=p;
  const seg=document.createElement('div');seg.className='seg';seg.style.background=s.cor;
  seg.innerHTML=`<button aria-label="Ir para ${s.t}"></button>`;seg.firstChild.onclick=()=>go(i);rail.appendChild(seg);s.seg=seg;
  const b=document.createElement('button');b.innerHTML=`<b>${n}</b><span>${s.t}</span>`;b.onclick=()=>{go(i);toggleMenu(false)};drawer.appendChild(b);s.db=b;
});
function toggleMenu(v){drawer.classList.toggle('on',v);$('#menuBtn').setAttribute('aria-expanded',v)}
$('#menuBtn').onclick=()=>toggleMenu(!drawer.classList.contains('on'));

// hotspots
const hots=$('#hots'),card=$('#card');let openHot=null;
HOTS.forEach((h,i)=>{
  const b=document.createElement('button');b.className='hot'+(h.ctx?' ctx':'');
  b.style.left=h.x/12+'%';b.style.top=h.y/60+'%';b.setAttribute('aria-label',h.n);
  b.onclick=e=>{e.stopPropagation();showCard(i)};
  hots.appendChild(b);h.el=b;
});
function showCard(i){
  const h=HOTS[i];openHot=i;
  card.innerHTML=`<button class="x" aria-label="Fechar">×</button><span class="tag ${h.ctx?'ctx':''}">${h.ctx?'Contexto':'Produto HMH'}</span><h3>${h.n}</h3><p>${h.d}</p>${h.u?`<a href="${BASE+h.u}" target="_blank" rel="noopener">Ver no site da HMH ↗</a>`:''}`;
  card.querySelector('.x').onclick=closeCard;card.classList.add('on');placeCard();
}
function closeCard(){openHot=null;card.classList.remove('on')}
function placeCard(){
  if(openHot==null)return;const r=HOTS[openHot].el.getBoundingClientRect();
  let x=r.right+14,y=r.top-10;if(x+270>innerWidth)x=r.left-274;if(x<8)x=8;y=clamp(y,60,innerHeight-200);
  card.style.left=x+'px';card.style.top=y+'px';
}
addEventListener('keydown',e=>{if(e.key==='Escape'){closeCard();toggleMenu(false)}});
document.addEventListener('click',e=>{if(!card.contains(e.target))closeCard()});

/* ---------- layout e rolagem ---------- */
let s=1,vh=innerHeight,cur=0;
function layout(){
  vh=innerHeight;const W=world.offsetWidth;s=W/1200;panels.style.height=hots.style.height=W*5+'px';
  SECS.forEach(x=>x.el.style.top=x.py*s+'px');
  size();update();
}
function go(i){i=clamp(i,0,SECS.length-1);scrollTo({top:SECS[i].foco*s-vh/2,behavior:RM?'auto':'smooth'})}
$('#bUp').onclick=$('#bPrev').onclick=()=>go(cur-1);
$('#bDn').onclick=$('#bNext').onclick=()=>go(cur+1);

const PT=[[540,28],[1400,10],[3840,3],[5650,95]];
function interp(pts,y){if(y<=pts[0][0])return pts[0][1];for(let i=1;i<pts.length;i++)if(y<=pts[i][0]){const t=(y-pts[i-1][0])/(pts[i][0]-pts[i-1][0]);return lerp(pts[i-1][1],pts[i][1],t)}return pts[pts.length-1][1]}
const depthOf=y=>y<=540?0:y<=3840?(y-540)/3300*2200:Math.min(5000,2200+(y-3840)/1810*2800);
const fmt=n=>Math.round(n).toLocaleString('pt-BR');
const rvs=[['#tens',720,380],['#lens',4720,420],['#reserv',5620,520],['#bopGlow',3700,500]].map(([q,y,r])=>({e:$(q),y,r}));
let lastDepthTxt='';

function update(){
  const sy=scrollY,cy=(sy+vh/2)/s,vhw=vh/s;
  // seção ativa
  let a=0;SECS.forEach((x,i)=>{if(cy>=x.foco-(i?(x.foco-SECS[i-1].foco)*.45:9999))a=i});
  cur=a;SECS.forEach((x,i)=>{x.seg.classList.toggle('on',i===a);x.seg.classList.toggle('done',i<a);x.db.classList.toggle('cur',i===a)});
  // painéis: fade in/out
  SECS.forEach(x=>{
    const pc=(x.py*s+x.el.offsetHeight/2)-(sy+vh/2),d=pc/vh;
    const o=1-smooth((Math.abs(d)-.3)/.28);
    x.el.style.opacity=o.toFixed(3);x.el.style.transform=`translateY(${(clamp(d,-1,1)*34).toFixed(1)}px)`;
    x.el.style.pointerEvents=o>.2?'auto':'none';
  });
  // elementos que acendem ao se aproximar
  rvs.forEach(r=>{const o=lerp(.2,1,1-smooth((Math.abs(cy-r.y)-r.r*.4)/(r.r*.9)));r.e.style.opacity=o.toFixed(3)});
  HOTS.forEach(h=>{const off=Math.abs(cy-h.y)>vhw*.62;h.el.dataset.off=off?1:0});
  // sonda
  const py=clamp(cy,560,5650);$('#probe').setAttribute('transform',`translate(600 ${py})`);
  // poço vivo ao chegar no reservatório
  const live=cy>5150;$('#planned').setAttribute('opacity',live?0:.7);$('#oilflow').setAttribute('opacity',live?1:0);
  // HUD
  const dep=depthOf(py),t=interp(PT,py);
  const lux=py<=540?100:clamp(100-(py-540)/1100*100,0,100);
  $('#hDepth').textContent=fmt(dep)+' m';$('#hPres').textContent=fmt(1+dep/10)+' bar';
  $('#hTemp').textContent=Math.round(t)+' °C';$('#hLux').textContent=Math.round(lux)+'%';
  const z=py<540?'Superfície':py<1500?'Zona fótica':py<3800?'Água profunda':py<4130?'Leito marinho':py<5230?'Subsolo':'Reservatório';
  if(z!==lastDepthTxt){$('#hZone').textContent=z;lastDepthTxt=z}
  snowK=py>600&&py<3900?smooth((py-600)/500)*smooth((3900-py)/200):0;
  placeCard();
}
let ticking=false;
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(()=>{update();ticking=false})}},{passive:true});
addEventListener('resize',layout);

/* ---------- movimento por tempo (top drive, cabos) ---------- */
function tick(t){
  t/=1000;
  const y=lerp(120,310,.5-.5*Math.cos(t*.6));
  _td.setAttribute('transform',`translate(0 ${y.toFixed(1)})`);
  _cab[0].setAttribute('x1',592);_cab[1].setAttribute('x1',624);
  _cab.forEach((c,i)=>{c.setAttribute('x2',i?624:592);c.setAttribute('y1',76);c.setAttribute('y2',y.toFixed(1))});
  _pipe.setAttribute('y1',y+50);_pipe.setAttribute('y2',398);$('#pipeM').setAttribute('y1',y+50);$('#pipeM').setAttribute('y2',398);
  // tensionadores acompanham o balanço
  const k=Math.sin(t*.9);$('#tL').style.transform=`rotate(${(-1.6*k).toFixed(2)}deg)`;$('#tR').style.transform=`rotate(${(1.6*k).toFixed(2)}deg)`;
  if(!RM)requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- neve marinha (canvas fixo) ---------- */
const cv=$('#snow'),cx=cv.getContext('2d');let snowK=0,dpr=1,P=[];
function size(){dpr=Math.min(devicePixelRatio||1,1.5);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  P=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:rnd()*innerWidth,y:rnd()*innerHeight,r:.6+rnd()*1.8,v:6+rnd()*14,z:.2+rnd()*.8,ph:rnd()*6.28}))}
let lastSY=scrollY,lt=0;
function snow(t){
  const dt=Math.min(.05,(t-lt)/1000||.016);lt=t;const dS=scrollY-lastSY;lastSY=scrollY;
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  if(snowK>.01){cx.fillStyle='#d4ecf7';
    for(const p of P){p.y+=p.v*dt*p.z-dS*p.z*.5;p.x+=Math.sin(t/1700+p.ph)*.12;
      if(p.y>innerHeight+4){p.y=-4;p.x=rnd()*innerWidth}if(p.y<-6){p.y=innerHeight+4;p.x=rnd()*innerWidth}
      cx.globalAlpha=snowK*(.18+.5*p.z);cx.beginPath();cx.arc(p.x,p.y,p.r*p.z+.4,0,6.283);cx.fill()}
    cx.globalAlpha=1}
  requestAnimationFrame(snow);
}
if(!RM)requestAnimationFrame(snow);

layout();
})();
</script>
</body>
</html>
