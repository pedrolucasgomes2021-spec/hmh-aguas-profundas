<html lang="pt-BR">
<head>

<title>HMH — Águas Profundas 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--abismo:#04101F;--navy:#0e2a4a;--ink:#EAF6FF;--soft:rgba(226,240,250,.84);--azul:#1496C8;--verm:#D9303C;--ambar:#FFB347;--ease:cubic-bezier(.2,.8,.2,1);--rail:26px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--abismo);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--ambar);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#spacer{height:1500vh}
.fx{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0}
#fxWater{background:radial-gradient(ellipse at 50% 40%,rgba(230,250,255,.9),rgba(120,200,235,.75) 60%,rgba(40,140,190,.7))}
#fxGround{background:radial-gradient(ellipse at 50% 50%,#1a120b,#050302 70%)}
.vign{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45))}

/* barra superior */
.top{position:fixed;inset:0 0 auto 0;height:50px;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px 0 calc(var(--rail) + 10px);background:linear-gradient(180deg,rgba(255,255,255,.93),rgba(255,255,255,.8));backdrop-filter:blur(8px);color:var(--navy);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.top .l{display:flex;align-items:center;gap:6px}
.ib{width:36px;height:36px;display:grid;place-content:center;border-radius:8px;transition:background .3s}
.ib:hover{background:rgba(14,42,74,.08)}
.menu i{display:block;width:18px;height:2px;background:var(--navy);border-radius:2px;margin:2.5px 0}
.snd svg{width:20px;height:20px}
.snd[aria-pressed="false"] .w{display:none}
.snd[aria-pressed="true"] .x{display:none}
.top .logo{height:26px;width:66px}
.pill{justify-self:end;background:var(--navy);color:#fff;font-weight:600;font-size:12px;letter-spacing:.04em;padding:9px 16px;border-radius:6px;text-decoration:none;transition:background .3s}
.pill:hover{background:var(--verm)}
.drawer{position:fixed;top:50px;left:var(--rail);width:min(320px,calc(100vw - var(--rail)));z-index:49;background:rgba(4,16,31,.94);backdrop-filter:blur(10px);border-radius:0 0 10px 0;padding:10px 0;transform:translateX(-110%);transition:transform .5s var(--ease)}
.drawer.on{transform:none}
.drawer button{display:flex;gap:12px;width:100%;text-align:left;padding:11px 18px;font-size:13px;font-weight:500;border-left:3px solid transparent;transition:background .3s}
.drawer button b{color:var(--ambar);font-variant-numeric:tabular-nums}
.drawer button:hover,.drawer button.cur{background:rgba(255,255,255,.07);border-left-color:var(--verm)}

/* trilho */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:48;display:flex;flex-direction:column}
.rail .seg{flex:1;position:relative;transition:filter .6s}
.rail .seg:not(.on){filter:brightness(.62) saturate(.8)}
.rail .seg button{position:absolute;left:50%;top:16px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:2px solid #fff;background:var(--navy);transition:background .4s,transform .5s var(--ease)}
.rail .seg.on button{background:#fff;transform:scale(1.25)}
.rail .seg .fill{position:absolute;left:50%;top:34px;width:2px;margin-left:-1px;height:0;background:rgba(255,255,255,.85)}

/* HUD */
.hud{position:fixed;right:12px;top:62px;z-index:45;width:158px;padding:10px 12px;border-radius:10px;background:rgba(4,16,31,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);font-size:11px;color:var(--soft)}
.hud div{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0}
.hud b{font-family:Oswald,"Arial Narrow",sans-serif;font-weight:500;font-size:15px;color:#fff;font-variant-numeric:tabular-nums}
.hud .big b{font-size:22px;color:var(--ambar)}
.hud small{display:block;margin-top:6px;opacity:.75;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.nav2{position:fixed;right:14px;bottom:100px;z-index:45;display:grid;gap:10px}
.nav2 button{width:32px;height:32px;border-radius:50%;display:grid;place-content:center;font-size:14px;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);transition:transform .4s var(--ease)}
.nav2 button:hover{transform:scale(1.12)}
.nav2 .up{background:var(--verm)} .nav2 .dn{background:#7a7e83}
.bottom{position:fixed;inset:auto 0 0 0;height:38px;z-index:47;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 calc(var(--rail) + 12px);background:linear-gradient(90deg,rgba(11,37,66,.92),rgba(18,53,92,.92));font-size:12px;font-weight:600;letter-spacing:.06em}
.bottom .logo{height:20px;width:52px;position:absolute;left:50%;transform:translateX(-50%)}
.bottom .arr{display:flex;gap:6px}
.bottom .arr button{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.2);font-size:13px}

/* textos das seções */
.panel{position:fixed;z-index:20;left:calc(var(--rail) + 28px);top:86px;width:min(360px,calc(100vw - var(--rail) - 44px));padding:18px 20px 20px;background:linear-gradient(135deg,rgba(4,18,36,.62),rgba(4,18,36,.38));backdrop-filter:blur(10px);border-radius:6px;border-left:3px solid var(--verm);line-height:1.5;opacity:0;pointer-events:none;will-change:opacity,transform,filter}
.panel h2{font-family:Oswald,"Arial Narrow",sans-serif;font-weight:600;font-size:clamp(19px,1.7vw,25px);letter-spacing:.02em;text-transform:uppercase;line-height:1.15;margin-bottom:8px}
.panel h2 em{font-style:normal;color:var(--ambar);margin-right:6px}
.panel p{font-size:13.5px;color:var(--soft)}
.panel .row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.panel a.btn{display:inline-block;background:var(--verm);color:#fff;font-weight:600;font-size:12px;padding:8px 16px;border-radius:4px;text-decoration:none;transition:background .3s,transform .4s var(--ease)}
.panel a.btn:hover{background:var(--ambar);color:#1a0b05;transform:translateY(-2px)}
.panel .hint{font-size:11.5px;color:var(--soft);opacity:.8}

/* hotspots (gatilhos do painel flutuante) */
#hots{position:fixed;inset:0;z-index:30;pointer-events:none}
.hp{position:absolute;left:0;top:0;display:flex;align-items:center;height:30px;padding:0 10px 0 9px;border-radius:15px;background:rgba(6,20,38,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:12px;font-weight:600;pointer-events:auto;white-space:nowrap;transition:opacity .45s,box-shadow .3s,background .3s;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.hp i{width:11px;height:11px;border-radius:50%;background:var(--azul);flex:none;box-shadow:0 0 0 0 rgba(20,150,200,.8);animation:ping 2.2s infinite}
.hp.ctx i{background:#b9c0c6;animation-name:pingg}
.hp span{max-width:0;overflow:hidden;opacity:0;margin-left:0;transition:max-width .5s var(--ease),opacity .35s,margin .5s var(--ease)}
.hp:hover span,.hp:focus-visible span,.hp.near span{max-width:260px;opacity:1;margin-left:8px}
.hp:hover{background:rgba(20,150,200,.55)}
.hp.off{opacity:0;pointer-events:none}
.hp.gone{visibility:hidden}
@keyframes ping{70%{box-shadow:0 0 0 12px rgba(20,150,200,0)}100%{box-shadow:0 0 0 0 rgba(20,150,200,0)}}
@keyframes pingg{70%{box-shadow:0 0 0 10px rgba(200,205,210,0)}100%{box-shadow:0 0 0 0 rgba(200,205,210,0)}}
.tag3d{position:fixed;left:0;top:0;z-index:12;pointer-events:none;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.75);text-shadow:0 1px 6px rgba(0,0,0,.8);transition:opacity .5s;opacity:0}

/* painel flutuante */
#scrim{position:fixed;inset:0;z-index:70;background:rgba(2,10,20,.35);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
#scrim.on{opacity:1;pointer-events:auto}
#fp{position:fixed;z-index:80;overflow:hidden;display:none;background:rgba(10,24,42,.86);backdrop-filter:blur(20px) saturate(1.3);border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 90px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1)}
.fp-in{padding:14px 16px 16px}
.fp-in header{display:flex;align-items:center;gap:9px;height:30px;margin-bottom:12px}
.fp-in header i{width:11px;height:11px;border-radius:50%;background:var(--azul);flex:none}
.fp-in header i.ctx{background:#b9c0c6}
.fp-in header b{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-in .tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--azul)}
.fp-in .tag.ctx{background:#6c7076}
.fp-in .x{width:30px;height:30px;border-radius:50%;font-size:18px;display:grid;place-content:center;background:rgba(255,255,255,.08);transition:background .3s}
.fp-in .x:hover{background:rgba(255,255,255,.2)}
.vid{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000 center/cover no-repeat}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .ph{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:8px;padding:20px;background:linear-gradient(135deg,#0d2f52,#061423);font-size:13px;color:var(--soft)}
.vid .ph b{font-size:16px;color:#fff}
.vid a.play{position:absolute;inset:0;display:grid;place-content:center;background:rgba(0,0,0,.25);transition:background .3s}
.vid a.play:hover{background:rgba(0,0,0,.05)}
.vid a.play span{width:70px;height:48px;border-radius:12px;background:#e62117;display:grid;place-content:center;font-size:20px}
.vid .note{position:absolute;left:8px;right:8px;bottom:8px;font-size:11px;background:rgba(0,0,0,.6);padding:6px 8px;border-radius:6px;color:#fff}
.fp-in p{font-size:13.5px;line-height:1.55;color:var(--soft);margin-top:12px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.acts a{font-size:12.5px;font-weight:600;text-decoration:none;padding:9px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.3);transition:background .3s,transform .4s var(--ease)}
.acts a.pri{background:var(--verm);border-color:var(--verm)}
.acts a:hover{transform:translateY(-2px);background:rgba(255,255,255,.12)}
.acts a.pri:hover{background:var(--ambar);color:#1a0b05;border-color:var(--ambar)}

/* intro */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-content:center;text-align:center;gap:18px;background:radial-gradient(ellipse at 50% 30%,#12406b,#04101F 70%);transition:opacity 1.2s var(--ease),visibility 1.2s}
#intro.out{opacity:0;visibility:hidden}
#intro svg{width:150px;height:60px;margin:0 auto}
#intro h1{font-family:Oswald,"Arial Narrow",sans-serif;font-weight:500;letter-spacing:.32em;font-size:clamp(28px,5vw,64px);padding-left:.32em}
#intro p{color:var(--soft);font-size:14px;letter-spacing:.2em;text-transform:uppercase}
#intro .go{margin-top:10px;background:var(--verm);color:#fff;font-weight:600;padding:14px 26px;border-radius:8px;font-size:14px;letter-spacing:.06em;transition:background .3s,transform .4s var(--ease),opacity .4s}
#intro .go:hover{background:var(--ambar);color:#1a0b05;transform:translateY(-2px)}
#intro .go:disabled{opacity:.5;cursor:wait}
#intro .mute{font-size:12px;color:var(--soft);text-decoration:underline;opacity:.8}
#intro .err{color:#ffb4b4;font-size:13px;max-width:420px}
@media (max-width:767px){.hud{top:58px;right:8px;width:132px;font-size:10px}.top .l .snd{display:grid}.panel{top:auto;bottom:50px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  const rk=u*Math.exp(Math.min(0,cy)/60);rays.forEach(m=>{m.visible=rk>.01;if(m.visible){m.material.opacity=rk*(.18+.1*Math.sin(t*.6+m.userData.ph));m.rotation.y=Math.atan2(camera.position.x-m.position.x,camera.position.z-m.position.z)}});
  // neve marinha
  snow.visible=u>.02&&gnd<.9;if(snow.visible){snow.material.opacity=.65*u*(1-gnd);const a=snow.geometry.attributes.position.array,cp=camera.position;
    for(let i=0;i<snowB.length;i++){const b=snowB[i];const y=b[1]-t*(.25+b[3]*.5);let dx=b[0]+Math.sin(t*.3+i)*.4-cp.x,dy=y-cp.y,dz=b[2]-cp.z;dx=((dx%140)+210)%140-70;dy=((dy%140)+210)%140-70;dz=((dz%140)+210)%140-70;a[i*3]=cp.x+dx;a[i*3+1]=cp.y+dy;a[i*3+2]=cp.z+dz}snow.geometry.attributes.position.needsUpdate=true}
  // bolhas
  bub.visible=cy<-450&&gnd<.9;if(bub.visible){const a=bub.geometry.attributes.position.array;bubS.forEach((b,i)=>{b.o.y+=b.s*dt;if(b.o.y>40){b.o.y=0;b.o.x=(rnd()-.5)*2;b.o.z=(rnd()-.5)*2}a[i*3]=b.v.x+b.o.x+Math.sin(t*2+i)*.2;a[i*3+1]=b.v.y+b.o.y;a[i*3+2]=b.v.z+b.o.z});bub.geometry.attributes.position.needsUpdate=true}
  // perfuração ligada à rolagem
  const drill=smooth((curP-.82)/.16);bitY=lerp(SEABED-165,SEABED-282,drill);
  bit.position.set(0,bitY,0);bit.rotation.y=t*4;openHole.scale.y=Math.max(.01,(SEABED-160)-(bitY-1));openHole.position.y=((SEABED-160)+(bitY-1))/2;
  dstring.position.set(0,(SEABED+bitY+1.4)/2,0);dstring.scale.y=SEABED-bitY-1.4;pipeMat.map.offset.x=-t*.8;
  planned.geometry.setFromPoints([V(0,bitY-1.5,.2),V(0,SEABED-284,.2)]);planned.computeLineDistances();planned.visible=drill<.98;
  const drilling=gnd>.3&&curP>.78;chips.material.opacity=drilling?.9:0;if(drilling){const a=chips.geometry.attributes.position.array;chipS.forEach((c,i)=>{c.l=(c.l+dt*c.s*.8)%1;const r=1.2+c.l*.6;a[i*3]=Math.cos(c.a+t)*r*.9;a[i*3+1]=bitY-.8+c.l*14;a[i*3+2]=Math.abs(Math.sin(c.a+t))*r*-.6+.5});chips.geometry.attributes.position.needsUpdate=true}
  const flow=smooth((drill-.9)/.1);oil.material.opacity=flow;if(flow>0){const a=oil.geometry.attributes.position.array;oilS.forEach((o,i)=>{o.y=(o.y+dt*o.s*.08)%1;a[i*3]=o.x;a[i*3+1]=lerp(bitY,SEABED,o.y);a[i*3+2]=.7});oil.geometry.attributes.position.needsUpdate=true}
  audio.mix(u,gnd,drilling?1-flow*.5:0);audio.update(dt);

  // HUD
  const depth=cy>=0?0:cy>SEABED?-cy/600*2200:2200+(SEABED-cy)/282*2800;
  const temp=cy>=0?27:cy>SEABED?lerp(27,4,smooth(-cy/260))-1*dk:lerp(3,95,clamp((SEABED-cy)/282));
  const lux=cy>=0?100:Math.max(0,100*Math.exp(cy/90))*(1-gnd);
  hud.d.textContent=fmt(Math.min(5000,depth))+' m';hud.p.textContent=fmt(1+depth/10)+' bar';hud.t.textContent=Math.round(temp)+' °C';hud.l.textContent=Math.round(lux)+'%';
  const zone=cy>=0?'Superfície':cy>-200?'Zona fótica':cy>SEABED+2?'Água profunda':cy>SEABED-8?'Leito marinho':curP<.92?'Subsolo':'Reservatório';if(zone!==lastZone){hud.z.textContent=zone;lastZone=zone}

  // painéis com fade in/out e trilho
  SECS.forEach((s,i)=>{const c=(BOUNDS[i]+Math.min(1,BOUNDS[i+1]))/2,hw=(Math.min(1,BOUNDS[i+1])-BOUNDS[i])/2;let d=(curP-c)/hw;if(i===0&&d<0)d=0;if(i===SECS.length-1&&d>0)d=0;
    const o=1-smooth((Math.abs(d)-.5)/.42);s.el.style.opacity=o.toFixed(3);s.el.style.transform=`translate3d(${(d*-14).toFixed(1)}px,${(d*-26).toFixed(1)}px,0)`;s.el.style.filter=`blur(${(Math.max(0,Math.abs(d)-.5)*12).toFixed(1)}px)`;s.el.style.pointerEvents=o>.4?'auto':'none';
    s.seg.classList.toggle('on',i===sec);s.db.classList.toggle('cur',i===sec);s.seg.lastChild.style.height=i<sec?'calc(100% - 34px)':i===sec?`calc((100% - 34px) * ${clamp((curP-BOUNDS[i])/(Math.min(1,BOUNDS[i+1])-BOUNDS[i])).toFixed(3)})`:'0'});
  updHots();
  TAGS.forEach(g=>{tmp.copy(g.p).project(camera);const on=gnd>.5&&tmp.z<1&&Math.abs(tmp.x)<1&&Math.abs(tmp.y)<1;g.e.style.opacity=on?1:0;if(on)g.e.style.transform=`translate3d(${((tmp.x*.5+.5)*innerWidth).toFixed(0)}px,${((-tmp.y*.5+.5)*innerHeight).toFixed(0)}px,0)`});
  composer.render(dt);
  requestAnimationFrame(frame);
}

buildRiser();
requestAnimationFrame(frame);
window.__ready=true;
const goBtn=$('#goBtn');goBtn.disabled=false;goBtn.textContent='Iniciar descida  🔊';
const enter=withSound=>{if(withSound)audio.start();$('#intro').classList.add('out');setTimeout(()=>$('#intro').remove(),1300)};
goBtn.onclick=()=>enter(true);$('#muteBtn').onclick=()=>enter(false);
</script>
