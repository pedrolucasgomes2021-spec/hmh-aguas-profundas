<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1724">
<title>HMH — Águas Profundas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e2a4a;--ink:#EAF6FF;--soft:rgba(226,240,250,.84);--azul:#1496C8;--verm:#D9303C;--ambar:#FFB347;--ease:cubic-bezier(.2,.8,.2,1);--rail:56px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1724;color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--ambar);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#spacer{height:720vh}

/* barra superior (como no layout de referência) */
.top{position:fixed;inset:0 0 auto 0;height:64px;z-index:50;display:flex;align-items:center;gap:10px;padding:0 18px 0 calc(var(--rail) + 18px);background:rgba(255,255,255,.96);backdrop-filter:blur(8px);color:var(--navy);box-shadow:0 1px 0 rgba(0,0,0,.1)}
.top .logo{height:34px;width:86px;margin-right:auto}
.tb{height:38px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--navy);transition:background .35s var(--ease),color .35s}
.tb:hover{background:rgba(14,42,74,.08)}
.tb[aria-pressed="true"]{background:var(--navy);color:#fff}
.tb svg{width:18px;height:18px}
.snd[aria-pressed="false"] .w{display:none}.snd[aria-pressed="true"] .x{display:none}
.pill{background:var(--navy);color:#fff;font-weight:600;font-size:12.5px;letter-spacing:.04em;padding:11px 20px;border-radius:7px;text-decoration:none;transition:background .3s}
.pill:hover{background:var(--verm)}
.menu{position:fixed;left:0;top:0;width:var(--rail);height:64px;z-index:52;display:grid;place-content:center;background:var(--navy)}
.menu i{display:block;width:20px;height:2px;background:#fff;margin:2.5px 0;border-radius:2px}
.drawer{position:fixed;top:64px;left:var(--rail);width:min(330px,calc(100vw - var(--rail)));z-index:49;background:rgba(8,22,38,.95);backdrop-filter:blur(10px);border-radius:0 0 12px 0;padding:10px 0;transform:translateX(-110%);transition:transform .6s var(--ease)}
.drawer.on{transform:none}
.drawer button{display:flex;gap:12px;width:100%;text-align:left;padding:12px 18px;font-size:13px;font-weight:500;border-left:3px solid transparent;transition:background .3s}
.drawer button b{color:var(--ambar);font-variant-numeric:tabular-nums}
.drawer button:hover,.drawer button.cur{background:rgba(255,255,255,.07);border-left-color:var(--verm)}

/* trilho lateral com segmentos coloridos */
.rail{position:fixed;left:0;top:64px;bottom:0;width:var(--rail);z-index:48;display:flex;flex-direction:column}
.rail .seg{flex:1;position:relative;transition:filter .8s var(--ease)}
.rail .seg:not(.on){filter:brightness(.7) saturate(.85)}
.rail .seg button{position:absolute;left:50%;top:18px;width:18px;height:18px;margin-left:-9px;border-radius:50%;border:2px solid #fff;background:transparent;transition:background .5s,transform .6s var(--ease)}
.rail .seg.on button{background:#fff;transform:scale(1.2)}
.rail .seg .ln{position:absolute;left:50%;top:38px;bottom:0;width:2px;margin-left:-1px;background:rgba(255,255,255,.35)}
.rail .seg .ln i{display:block;width:100%;height:0;background:#fff}

/* HUD de profundidade */
.hud{position:fixed;right:16px;top:80px;z-index:45;width:164px;padding:11px 13px;border-radius:12px;background:rgba(8,20,34,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);font-size:11px;color:var(--soft);transition:opacity .6s}
.hud div{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0}
.hud b{font-family:Oswald,"Arial Narrow",sans-serif;font-weight:500;font-size:15px;color:#fff;font-variant-numeric:tabular-nums}
.hud .big b{font-size:22px;color:var(--ambar)}
.hud small{display:block;margin-top:6px;opacity:.75;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.nav2{position:fixed;right:22px;top:50%;z-index:45;display:grid;justify-items:center;gap:8px;transform:translateY(-50%)}
.nav2 button{width:34px;height:34px;border-radius:50%;display:grid;place-content:center;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35);transition:transform .5s var(--ease)}
.nav2 button:hover{transform:scale(1.12)}
.nav2 .up{background:var(--verm)}.nav2 .dn{background:#7a7e83}
.nav2 span{width:2px;height:26px;background:rgba(255,255,255,.5)}
.bottom{position:fixed;inset:auto 0 0 0;height:52px;z-index:47;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 calc(var(--rail) + 18px);background:#0e2a4a;font-size:14px;font-weight:600;letter-spacing:.06em}
.bottom .logo{height:26px;width:66px;position:absolute;left:50%;transform:translateX(-50%)}
.bottom .arr{display:flex;gap:8px}
.bottom .arr button{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);font-size:15px;transition:background .3s}
.bottom .arr button:hover{background:rgba(255,255,255,.32)}

/* textos das seções: troca suave, sem desfoque */
.panel{position:fixed;z-index:20;left:calc(var(--rail) + 36px);top:50%;width:min(390px,calc(100vw - var(--rail) - 60px));line-height:1.5;opacity:0;pointer-events:none;will-change:opacity,transform;text-shadow:0 1px 14px rgba(0,0,0,.55)}
.panel h2{font-family:Oswald,"Arial Narrow",sans-serif;font-weight:600;font-size:clamp(22px,2.1vw,32px);letter-spacing:.01em;text-transform:uppercase;line-height:1.12;margin-bottom:12px}
.panel p{font-size:14px;color:var(--soft)}
.panel .row{display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}
.panel a.btn{display:inline-block;background:var(--verm);color:#fff;font-weight:600;font-size:12.5px;padding:9px 18px;border-radius:4px;text-decoration:none;text-shadow:none;transition:background .35s,transform .5s var(--ease)}
.panel a.btn:hover{background:var(--ambar);color:#1a0b05;transform:translateY(-2px)}
.panel .hint{font-size:12px;color:var(--soft);opacity:.85}
.panel.light{color:#0e2a4a;text-shadow:0 1px 10px rgba(255,255,255,.6)}
.panel.light p,.panel.light .hint{color:#1f3550}

/* gatilhos (hotspots) */
#hots,#tags,#ovb{position:fixed;inset:0;pointer-events:none}
#hots{z-index:30}#tags{z-index:12}#ovb{z-index:31}
.hp{position:absolute;left:0;top:0;display:flex;align-items:center;height:30px;padding:0 9px;border-radius:15px;background:rgba(8,22,40,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.32);color:#fff;font-size:12px;font-weight:600;pointer-events:auto;white-space:nowrap;transition:opacity .6s var(--ease),background .3s;box-shadow:0 4px 16px rgba(0,0,0,.28)}
.hp i{width:11px;height:11px;border-radius:50%;background:var(--azul);flex:none;box-shadow:0 0 0 0 rgba(20,150,200,.8);animation:ping 2.4s infinite}
.hp.ctx i{background:#c3c9ce;animation-name:pingg}
.hp span{max-width:0;overflow:hidden;opacity:0;transition:max-width .55s var(--ease),opacity .35s,margin .55s var(--ease)}
.hp:hover span,.hp:focus-visible span{max-width:260px;opacity:1;margin-left:8px}
.hp:hover{background:rgba(20,150,200,.6)}
.hp.off{opacity:0;pointer-events:none}
.hp.gone{visibility:hidden}
@keyframes ping{70%{box-shadow:0 0 0 12px rgba(20,150,200,0)}100%{box-shadow:0 0 0 0 rgba(20,150,200,0)}}
@keyframes pingg{70%{box-shadow:0 0 0 10px rgba(200,205,210,0)}100%{box-shadow:0 0 0 0 rgba(200,205,210,0)}}
.tag3d{position:absolute;left:0;top:0;font-size:12px;font-weight:600;letter-spacing:.05em;color:rgba(255,255,255,.85);text-shadow:0 1px 8px rgba(0,0,0,.9);transition:opacity .7s;opacity:0;white-space:nowrap}
.tag3d.big{font-size:17px;letter-spacing:.02em}
/* visão geral */
.ov{position:absolute;left:0;top:0;display:flex;align-items:center;gap:10px;pointer-events:auto;padding:6px 14px 6px 6px;border-radius:24px;background:rgba(8,22,40,.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:600;color:#fff;opacity:0;transition:opacity .6s var(--ease),background .3s;white-space:nowrap}
.ov b{width:30px;height:30px;border-radius:50%;display:grid;place-content:center;background:var(--verm);font-family:Oswald,sans-serif;font-size:14px}
.ov:hover{background:rgba(20,150,200,.6)}
.ov.off{opacity:0!important;pointer-events:none}

/* painel flutuante (gatilho vira painel) */
#scrim{position:fixed;inset:0;z-index:70;background:rgba(2,10,20,.38);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
#scrim.on{opacity:1;pointer-events:auto}
#fp{position:fixed;z-index:80;overflow:hidden;display:none;background:rgba(12,26,44,.9);backdrop-filter:blur(22px) saturate(1.3);border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 90px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1)}
.fp-in{padding:14px 16px 16px}
.fp-in header{display:flex;align-items:center;gap:9px;height:30px;margin-bottom:12px}
.fp-in header i{width:11px;height:11px;border-radius:50%;background:var(--azul);flex:none}
.fp-in header i.ctx{background:#c3c9ce}
.fp-in header b{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-in .tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--azul)}
.fp-in .tag.ctx{background:#6c7076}
.fp-in .x{width:30px;height:30px;border-radius:50%;font-size:18px;display:grid;place-content:center;background:rgba(255,255,255,.08);transition:background .3s}
.fp-in .x:hover{background:rgba(255,255,255,.2)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{font-size:12px;font-weight:600;padding:7px 12px;border-radius:7px;background:rgba(255,255,255,.07);transition:background .3s}
.tabs button[aria-selected="true"]{background:#fff;color:var(--navy)}
.stage{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#3a4048,#16191d 75%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.stage .cap{position:absolute;left:12px;bottom:10px;font-size:11px;color:rgba(255,255,255,.7);pointer-events:none}
.stage .badge{position:absolute;right:12px;bottom:10px;width:52px;height:20px;pointer-events:none}
.stage a.play{position:absolute;inset:0;display:grid;place-content:center;background:#000 center/cover no-repeat}
.stage a.play span{width:70px;height:48px;border-radius:12px;background:#e62117;display:grid;place-content:center;font-size:20px}
.stage .note{position:absolute;left:8px;right:8px;bottom:8px;font-size:11px;background:rgba(0,0,0,.65);padding:6px 8px;border-radius:6px}
.fp-in p{font-size:13.5px;line-height:1.55;color:var(--soft);margin-top:12px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.acts a{font-size:12.5px;font-weight:600;text-decoration:none;padding:9px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.3);transition:background .3s,transform .5s var(--ease)}
.acts a.pri{background:var(--verm);border-color:var(--verm)}
.acts a:hover{transform:translateY(-2px);background:rgba(255,255,255,.12)}
.acts a.pri:hover{background:var(--ambar);color:#1a0b05;border-color:var(--ambar)}

/* intro */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-content:center;text-align:center;gap:18px;background:radial-gradient(ellipse at 50% 30%,#163f66,#0b1724 70%);transition:opacity 1.2s var(--ease),visibility 1.2s}
#intro.out{opacity:0;visibility:hidden}
#intro svg{width:160px;height:64px;margin:0 auto}
#intro h1{font-family:Oswald,"Arial Narrow",sans-serif;font-weight:500;letter-spacing:.32em;font-size:clamp(28px,5vw,64px);padding-left:.32em}
#intro p{color:var(--soft);font-size:14px;letter-spacing:.2em;text-transform:uppercase}
#intro .go{margin-top:10px;background:var(--verm);color:#fff;font-weight:600;padding:14px 26px;border-radius:8px;font-size:14px;letter-spacing:.06em;transition:background .3s,transform .5s var(--ease),opacity .4s}
#intro .go:hover{background:var(--ambar);color:#1a0b05;transform:translateY(-2px)}
#intro .go:disabled{opacity:.55;cursor:wait}
#intro .mute{font-size:12px;color:var(--soft);text-decoration:underline;opacity:.8}
#intro .err{color:#ffb4b4;font-size:13px;max-width:420px}
@media (max-width:767px){:root{--rail:40px}.top{height:56px}.menu{height:56px}.rail{top:56px}.tb .lbl{display:none}.pill{display:none}.hud{top:66px;right:8px;width:132px;font-size:10px}.nav2{right:8px}.panel{top:auto;bottom:66px;left:calc(var(--rail) + 12px);width:calc(100vw - var(--rail) - 24px);padding:14px;border-radius:10px;background:rgba(8,22,38,.62);backdrop-filter:blur(8px)}.bottom{height:44px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</script>

<footer class="bottom"><span>HMHW</span><svg class="logo" viewBox="0 0 100 40"><use href="#logo"/></svg><span class="arr"><button id="bPrev" aria-label="Anterior">‹</button><button id="bNext" aria-label="Próxima">›</button></span></footer>
