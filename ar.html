<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ver em AR · HMH</title>
<meta name="robots" content="noindex">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.4.0/dist/model-viewer.min.js"></script>
<style>
:root{--navy:#0e2a4a;--ink:#eaf6ff;--bg:#16222e}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,sans-serif;overflow:hidden}
model-viewer{position:fixed;inset:0;width:100%;height:100%;--poster-color:transparent;background:radial-gradient(120% 90% at 50% 25%,#27455c,#0e1c28)}
header{position:fixed;left:12px;right:12px;top:12px;z-index:2;padding:12px 14px;border-radius:14px;background:rgba(8,22,38,.78);backdrop-filter:blur(8px)}
header b{display:block;font:600 17px/1.25 system-ui}
header small{opacity:.8;font-size:13px}
.msg{position:fixed;left:12px;right:12px;bottom:18px;z-index:2;padding:12px 14px;border-radius:14px;background:rgba(8,22,38,.82);text-align:center;font-size:14px}
.erro{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px}
.erro[hidden]{display:none}
button.ar{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:3;min-height:48px;padding:0 22px;border:0;border-radius:99px;background:#fff;color:var(--navy);font:700 15px system-ui}
button.ar[hidden]{display:none}
</style>
</head>
<body>
<header>
  <b id="nome">Equipamento HMH</b>
  <small id="sub">Carregando modelo 3D…</small>
</header>

<model-viewer id="mv" alt="Modelo 3D do equipamento HMH" camera-controls auto-rotate shadow-intensity="1" environment-image="neutral" exposure="1" touch-action="pan-y"
  ar ar-modes="scene-viewer quick-look webxr" ar-scale="fixed" ar-placement="floor" xr-environment>
  <button slot="ar-button" class="ar" id="btnAr" hidden>Ver em AR no meu celular</button>
</model-viewer>

<div class="msg" id="dica">Arraste para girar · pinça para aproximar · toque em “Ver em AR” para colocar no chão em tamanho real</div>
<div class="erro" id="erro" hidden><div><b>Equipamento não encontrado</b><br>Leia o QR code novamente a partir da ficha do equipamento.</div></div>

<script type="module">
const eq = new URLSearchParams(location.search).get('eq');
const mv = document.getElementById('mv');
const base = new URL('.', location.href);
let lista = {};
try { lista = await fetch(new URL('assets/ar/equipamentos.json', base)).then(r => r.json()); } catch (e) {}
const item = lista[eq];
if (!item) {
  document.getElementById('erro').hidden = false;
  document.getElementById('dica').hidden = true;
  document.querySelector('header').hidden = true;
  mv.hidden = true;
} else {
  document.getElementById('nome').textContent = item.nome;
  document.getElementById('sub').textContent = item.sub || 'Modelo interpretado a partir das fotos HMH · escala real em AR';
  document.title = item.nome + ' · Ver em AR';
  mv.src = new URL(item.glb, base).href;
  mv.iosSrc = new URL(item.usdz, base).href;
  mv.alt = item.nome;
  mv.addEventListener('load', () => { document.getElementById('sub').textContent = 'Arraste para girar · escala real em AR'; document.getElementById('btnAr').hidden = !mv.canActivateAR; });
  mv.addEventListener('error', () => { document.getElementById('sub').textContent = 'Não foi possível carregar o modelo. Verifique a conexão.'; });
}
</script>
</body>
</html>
